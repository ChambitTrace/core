apiVersion: v1
kind: ConfigMap
metadata:
  name: chambit-agent-config
  namespace: monitor
data:
  # Kafka VM의 LAN 주소를 우선 사용하세요. 필요 시 tailscale 주소를 콤마로 추가할 수 있습니다.
  # 예) 192.168.200.50:9092,100.88.10.20:9092
  KAFKA_BROKERS: "192.168.200.50:9092"
  KAFKA_TOPIC: "chambit-ebpf-events"
  CLUSTER_NAME: "homelab-k3s"
  KAFKA_BATCH_SIZE: "100"
  KAFKA_BATCH_TIMEOUT_MS: "1000"
  KAFKA_WRITE_TIMEOUT_MS: "5000"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: chambit-innodeagent
  namespace: monitor
spec:
  selector:
    matchLabels:
      app: chambit-innodeagent
  template:
    metadata:
      labels:
        app: chambit-innodeagent
    spec:
      serviceAccountName: ebpf-monitor-sa
      hostPID: true
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: chambit-innodeagent
        image: ghcr.io/chambittrace/core:v1.0.4
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: chambit-agent-config
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        securityContext:
          privileged: true
          capabilities:
            add: ["SYS_ADMIN", "SYS_RESOURCE"]
        volumeMounts:
        - name: proc
          mountPath: /proc
          readOnly: true
        - name: bpf
          mountPath: /sys/fs/bpf
        - name: modules
          mountPath: /lib/modules
          readOnly: true
        - name: debugfs
          mountPath: /sys/kernel/debug
      volumes:
      - name: proc
        hostPath:
          path: /proc
      - name: bpf
        hostPath:
          path: /sys/fs/bpf
      - name: modules
        hostPath:
          path: /lib/modules
      - name: debugfs
        hostPath:
          path: /sys/kernel/debug
