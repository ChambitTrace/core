apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: chambit-agent
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: chambit-agent
  template:
    metadata:
      labels:
        app: chambit-agent
    spec:
      imagePullSecrets:
      - name: chambit-ghcr-secret
      hostPID: true
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: chambit-agent
        image: ghcr.io/chambittrace/core:v1.0.4
        imagePullPolicy: IfNotPresent
        env:
        - name: KAFKA_BROKERS
          value: "192.168.200.50:9092"
        - name: KAFKA_TOPIC
          value: "chambit-ebpf-events"
        - name: CLUSTER_NAME
          value: "homelab-k3s"
        - name: KAFKA_BATCH_SIZE
          value: "100"
        - name: KAFKA_BATCH_TIMEOUT_MS
          value: "1000"
        - name: KAFKA_WRITE_TIMEOUT_MS
          value: "5000"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        securityContext:
          privileged: true
          capabilities:
            add: ["SYS_ADMIN", "SYS_RESOURCE"]
        volumeMounts:
        - name: proc
          mountPath: /proc
          readOnly: true
        - name: bpf
          mountPath: /sys/fs/bpf
        - name: modules
          mountPath: /lib/modules
          readOnly: true
        - name: debugfs
          mountPath: /sys/kernel/debug
      volumes:
      - name: proc
        hostPath:
          path: /proc
      - name: bpf
        hostPath:
          path: /sys/fs/bpf
      - name: modules
        hostPath:
          path: /lib/modules
      - name: debugfs
        hostPath:
          path: /sys/kernel/debug
      restartPolicy: Always
