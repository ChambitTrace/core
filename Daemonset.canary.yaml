apiVersion: v1
kind: ConfigMap
metadata:
  name: chambit-agent-config
  namespace: monitor
data:
  KAFKA_BROKERS: "192.168.200.178:9092"
  KAFKA_TOPIC: "chambit-ebpf-events"
  CLUSTER_NAME: "proxmox-k8s"
  KAFKA_BATCH_SIZE: "100"
  KAFKA_BATCH_TIMEOUT_MS: "1000"
  KAFKA_WRITE_TIMEOUT_MS: "5000"
  ENABLE_OPEN_EVENTS: "false"
  ENABLE_READ_EVENTS: "false"
  ENABLE_WRITE_EVENTS: "false"
  LOG_EACH_EVENT: "false"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: chambit-innodeagent-canary
  namespace: monitor
spec:
  selector:
    matchLabels:
      app: chambit-innodeagent-canary
  template:
    metadata:
      labels:
        app: chambit-innodeagent-canary
    spec:
      serviceAccountName: ebpf-monitor-sa
      hostPID: true
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: "REPLACE_WITH_CANARY_NODE"
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: chambit-innodeagent
        image: 192.168.200.178:5001/chambit-core:safe
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: chambit-agent-config
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        securityContext:
          privileged: true
          capabilities:
            add: ["SYS_ADMIN", "SYS_RESOURCE"]
        volumeMounts:
        - name: proc
          mountPath: /proc
          readOnly: true
        - name: bpf
          mountPath: /sys/fs/bpf
        - name: modules
          mountPath: /lib/modules
          readOnly: true
        - name: debugfs
          mountPath: /sys/kernel/debug
      volumes:
      - name: proc
        hostPath:
          path: /proc
      - name: bpf
        hostPath:
          path: /sys/fs/bpf
      - name: modules
        hostPath:
          path: /lib/modules
      - name: debugfs
        hostPath:
          path: /sys/kernel/debug
